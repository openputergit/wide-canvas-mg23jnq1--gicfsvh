<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neubrutalism Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Space Grotesk', sans-serif;
        }
        .neu-brutal {
            border: 3px solid #000;
            box-shadow: 5px 5px 0px #000;
            transition: all 0.2s ease;
        }
        .neu-brutal:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #000;
        }
        .task-item {
            transform: perspective(1000px) rotateX(0deg);
            transition: transform 0.3s ease;
        }
        .task-item:hover {
            transform: perspective(1000px) rotateX(2deg);
        }
    </style>
</head>
<body class="min-h-screen bg-[#FFE5E5] p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <h1 class="text-4xl md:text-6xl font-bold mb-8 neu-brutal bg-[#FFF] p-4 inline-block">
            Task Manager <i class="bi bi-list-check"></i>
        </h1>

        <!-- Search Bar -->
        <div class="mb-8">
            <div class="flex gap-4">
                <input type="text" 
                    id="searchInput"
                    placeholder="Search for tasks" 
                    class="w-full p-4 text-lg neu-brutal bg-white focus:outline-none">
                <button onclick="addTask()" class="neu-brutal bg-[#98FB98] p-4 text-lg hover:bg-[#90EE90]">
                    Add Task <i class="bi bi-plus-lg"></i>
                </button>
            </div>
        </div>

        <!-- Task List -->
        <div id="taskList" class="space-y-4">
            <!-- Tasks will be added here dynamically -->
        </div>
    </div>

    <script>
        let tasks = [];

        function addTask() {
            const taskInput = document.getElementById('searchInput');
            if (taskInput.value.trim() !== '') {
                const task = {
                    id: Date.now(),
                    text: taskInput.value,
                    completed: false,
                    date: new Date().toLocaleDateString()
                };
                tasks.push(task);
                taskInput.value = '';
                renderTasks();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';
            
            tasks.forEach(task => {
                const taskElement = document.createElement('div');
                taskElement.className = `task-item neu-brutal bg-white p-4 flex items-center justify-between ${task.completed ? 'bg-[#E0E0E0]' : ''}`;
                
                taskElement.innerHTML = `
                    <div class="flex items-center gap-4">
                        <input type="checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="toggleTask(${task.id})"
                            class="w-6 h-6 neu-brutal cursor-pointer">
                        <span class="${task.completed ? 'line-through' : ''}">${task.text}</span>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm text-gray-500">${task.date}</span>
                        <button onclick="deleteTask(${task.id})" 
                            class="neu-brutal bg-[#FFB6C1] p-2 hover:bg-[#FF69B4]">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                `;
                
                taskList.appendChild(taskElement);
            });
        }

        // Enter key functionality
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
